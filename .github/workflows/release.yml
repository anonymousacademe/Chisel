name: Release

# workflow_dispatch: test build, everything is uploaded as workflow artifacts (no release).
# push of a tag v*: the same build, then a DRAFT GitHub Release with every file and
# SHA256SUMS.txt; a person publishes it after looking at it.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # the self-test loads the built UI in QtWebEngine on Qt's offscreen platform (Linux)
  LOREWRITE_SELFTEST_RENDER: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  ui:
    name: Build the web UI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/lorewrite/__init__.py').read()).group(1))")
          test "v$ver" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$ver"; exit 1; }
      - run: npm ci
        working-directory: gui
      - run: npm run build
        working-directory: gui
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: src/lorewrite/gui/web
          if-no-files-found: error

  python-dist:
    name: sdist and wheel
    needs: ui
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: src/lorewrite/gui/web
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux AppImage
    needs: ui
    runs-on: ubuntu-22.04   # older glibc, so the AppImage runs on more systems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: src/lorewrite/gui/web
      - name: System libraries for QtWebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libxkbcommon0 libxkbcommon-x11-0 \
            libegl1 libgl1 libopengl0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxi6 \
            libasound2 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libfontconfig1 libglib2.0-0
      - run: |
          python -m pip install --upgrade pip
          pip install ".[all]" -r packaging/requirements-build.txt
      - name: Bundle, self-test, AppImage
        run: python packaging/build.py all
      - name: Self-test the AppImage itself
        run: |
          app=$(ls dist/release/*.AppImage)
          "$app" --appimage-extract-and-run --self-test
          "$app" --appimage-extract-and-run --terminal --help
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows installer and portable zip
    needs: ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: src/lorewrite/gui/web
      - run: |
          python -m pip install --upgrade pip
          pip install ".[all]" -r packaging/requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress   # pinned; chocolatey checks the installer's checksum
      - name: Bundle, self-test, package
        run: python packaging/build.py all
      - name: Install silently and self-test the installed copy
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/release -Filter "*-windows-setup.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "LoreWriterInstalled"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -Wait
          python packaging/build.py selftest --gui "$dir\LoreWriter.exe" --tui "$dir\lorewrite.exe"
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      LOREWRITE_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: web-ui
          path: src/lorewrite/gui/web
      - run: |
          python -m pip install --upgrade pip
          pip install ".[all]" -r packaging/requirements-build.txt
      - name: Bundle, self-test, DMG
        run: python packaging/build.py all
      - name: Self-test the app as it comes out of the DMG
        run: |
          dmg=$(ls dist/release/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          python packaging/build.py selftest --gui "$mnt/LoreWriter.app/Contents/MacOS/LoreWriter" --tui "$mnt/LoreWriter.app/Contents/MacOS/lorewrite"
          hdiutil detach "$mnt" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-dist, linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # creating the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" \
            --draft --title "LoreWriter ${GITHUB_REF_NAME#v}" \
            --notes "Installers for Windows, macOS (Apple silicon and Intel) and Linux. Unsigned: see the README's Install section for the first-launch steps."
