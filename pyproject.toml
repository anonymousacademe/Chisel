[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lorewriter"
dynamic = ["version"]
description = "A desktop and terminal fiction-writing app: plain Markdown projects, wiki-linked characters and places, AI that only suggests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mishkin", email = "anonymousacademe@proton.me" }]
keywords = ["fiction", "writing", "novel", "markdown", "wiki-links", "textual", "editor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
]
requires-python = ">=3.11"
dependencies = [
    "textual[syntax]>=3.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "keyring>=25.0",
    "pyspellchecker>=0.8",
    "platformdirs>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual-dev>=1.5",
]
gui = [
    "pywebview>=6",
]
export = [
    "reportlab>=4",
    "pyphen>=0.14",
]
all = [
    "pywebview>=6",
    "reportlab>=4",
    "pyphen>=0.14",
]

[project.urls]
Homepage = "https://github.com/anonymousacademe/lorewriter"
Issues = "https://github.com/anonymousacademe/lorewriter/issues"

[project.scripts]
lorewrite = "lorewrite.tui.app:main"
lorewrite-gui = "lorewrite.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "lorewrite.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the built UI (npm run build in gui/) and the vendored export fonts
"lorewrite.gui" = ["web/*", "web/**/*"]
"lorewrite.core.export" = ["fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
