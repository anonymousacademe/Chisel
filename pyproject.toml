[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorewrite"
version = "0.2.0"
description = "Terminal-native fiction writing with wiki-linked characters and places"
requires-python = ">=3.11"
dependencies = [
    "textual[syntax]>=3.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "keyring>=25.0",
    "pyspellchecker>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual-dev>=1.5",
]
gui = [
    "pywebview>=6",
]
export = [
    "reportlab>=4",
    "pyphen>=0.14",
]

[project.scripts]
lorewrite = "lorewrite.tui.app:main"
lorewrite-gui = "lorewrite.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
